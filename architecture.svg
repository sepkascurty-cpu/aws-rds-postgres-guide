<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- white background per AWS reference style -->
  <rect width="1300" height="900" fill="#ffffff"/>

  <text x="650" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#232f3e">AWS RDS PostgreSQL — Multi-AZ Production Architecture</text>
  <text x="650" y="64" text-anchor="middle" font-size="13" fill="#5b6b7c">users &#8594; Route 53 &#8594; WAF &#8594; ALB &#8594; RDS Proxy &#8594; Multi-AZ PostgreSQL (private DB subnets)</text>

  <!-- ============ LEFT RAIL: traffic ingress ============ -->
  <rect x="30" y="150" width="150" height="100" rx="10" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
  <text x="105" y="190" text-anchor="middle" font-size="15" font-weight="700" fill="#232f3e">Users</text>
  <text x="105" y="214" text-anchor="middle" font-size="12" fill="#5b6b7c">web / mobile apps</text>
  <text x="105" y="232" text-anchor="middle" font-size="11" fill="#8795a1">HTTPS</text>

  <line x1="105" y1="250" x2="105" y2="280" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="118" y="270" font-size="11" fill="#5b6b7c">1 &#183; DNS</text>

  <rect x="30" y="285" width="150" height="90" rx="10" fill="#8c4fff"/>
  <text x="105" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Route 53</text>
  <text x="105" y="344" text-anchor="middle" font-size="12" fill="#ffffff">DNS &#183; alias to ALB</text>

  <line x1="105" y1="375" x2="105" y2="405" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="118" y="395" font-size="11" fill="#5b6b7c">2 &#183; HTTPS</text>

  <rect x="30" y="410" width="150" height="90" rx="10" fill="#dd344c"/>
  <text x="105" y="447" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AWS WAF</text>
  <text x="105" y="469" text-anchor="middle" font-size="12" fill="#ffffff">SQLi / rate rules</text>

  <!-- ============ REGION ============ -->
  <rect x="210" y="110" width="1060" height="560" rx="10" fill="none" stroke="#232f3e" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="226" y="136" font-size="13" font-weight="700" fill="#232f3e">AWS Region &#8212; ap-southeast-1 (VPC 10.0.0.0/16)</text>

  <!-- ===== AZ-A ===== -->
  <rect x="230" y="155" width="500" height="495" rx="8" fill="none" stroke="#8795a1" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="245" y="178" font-size="12" font-weight="700" fill="#8795a1">Availability Zone A</text>

  <rect x="245" y="195" width="470" height="115" rx="6" fill="#f0e6ff" stroke="#8c4fff" stroke-width="1.5"/>
  <text x="258" y="217" font-size="11" font-weight="700" fill="#8c4fff">Public subnets &#183; 10.0.1.0/24</text>
  <rect x="380" y="230" width="200" height="60" rx="8" fill="#8c4fff"/>
  <text x="480" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Application Load Balancer</text>
  <text x="480" y="274" text-anchor="middle" font-size="11" fill="#ffffff">TLS termination &#183; target groups</text>

  <rect x="245" y="325" width="470" height="125" rx="6" fill="#fff3e0" stroke="#ff9900" stroke-width="1.5"/>
  <text x="258" y="347" font-size="11" font-weight="700" fill="#b26a00">Private app subnets &#183; 10.0.11.0/24</text>
  <rect x="255" y="360" width="210" height="70" rx="8" fill="#ff9900"/>
  <text x="360" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ECS Fargate</text>
  <text x="360" y="406" text-anchor="middle" font-size="11" fill="#ffffff">app tier &#183; private</text>
  <rect x="485" y="360" width="200" height="70" rx="8" fill="#ff9900"/>
  <text x="585" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">RDS Proxy</text>
  <text x="585" y="406" text-anchor="middle" font-size="11" fill="#ffffff">connection pooling</text>

  <rect x="245" y="465" width="470" height="170" rx="6" fill="#e3eafd" stroke="#3b48cc" stroke-width="1.5"/>
  <text x="258" y="487" font-size="11" font-weight="700" fill="#3b48cc">Private DB subnets &#183; 10.0.21.0/24 (no internet route)</text>
  <rect x="365" y="500" width="230" height="110" rx="8" fill="#3b48cc"/>
  <text x="480" y="530" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">RDS PostgreSQL</text>
  <text x="480" y="550" text-anchor="middle" font-size="12" font-weight="700" fill="#ffd75e">PRIMARY</text>
  <text x="480" y="570" text-anchor="middle" font-size="11" fill="#ffffff">db.m6i.large &#183; Multi-AZ</text>
  <text x="480" y="587" text-anchor="middle" font-size="11" fill="#ffffff">gp3 200 GB &#183; encrypted</text>

  <!-- ===== AZ-B ===== -->
  <rect x="750" y="155" width="500" height="495" rx="8" fill="none" stroke="#8795a1" stroke-width="1.5" stroke-dasharray="8,5"/>
  <text x="765" y="178" font-size="12" font-weight="700" fill="#8795a1">Availability Zone B</text>

  <rect x="765" y="195" width="470" height="115" rx="6" fill="#f0e6ff" stroke="#8c4fff" stroke-width="1.5"/>
  <text x="778" y="217" font-size="11" font-weight="700" fill="#8c4fff">Public subnets &#183; 10.0.2.0/24</text>
  <rect x="900" y="230" width="200" height="60" rx="8" fill="#8c4fff"/>
  <text x="1000" y="255" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Application Load Balancer</text>
  <text x="1000" y="274" text-anchor="middle" font-size="11" fill="#ffffff">TLS termination &#183; target groups</text>

  <rect x="765" y="325" width="470" height="125" rx="6" fill="#fff3e0" stroke="#ff9900" stroke-width="1.5"/>
  <text x="778" y="347" font-size="11" font-weight="700" fill="#b26a00">Private app subnets &#183; 10.0.12.0/24</text>
  <rect x="775" y="360" width="210" height="70" rx="8" fill="#ff9900"/>
  <text x="880" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ECS Fargate</text>
  <text x="880" y="406" text-anchor="middle" font-size="11" fill="#ffffff">app tier &#183; private</text>
  <rect x="1005" y="360" width="200" height="70" rx="8" fill="#ff9900"/>
  <text x="1105" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">RDS Proxy</text>
  <text x="1105" y="406" text-anchor="middle" font-size="11" fill="#ffffff">connection pooling</text>

  <rect x="765" y="465" width="470" height="170" rx="6" fill="#e3eafd" stroke="#3b48cc" stroke-width="1.5"/>
  <text x="778" y="487" font-size="11" font-weight="700" fill="#3b48cc">Private DB subnets &#183; 10.0.22.0/24 (no internet route)</text>
  <rect x="775" y="500" width="200" height="70" rx="8" fill="#3b48cc" opacity="0.85"/>
  <text x="875" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">STANDBY</text>
  <text x="875" y="547" text-anchor="middle" font-size="11" fill="#ffffff">sync replica &#183; auto-failover</text>
  <rect x="995" y="500" width="210" height="70" rx="8" fill="#ffffff" stroke="#3b48cc" stroke-width="2"/>
  <text x="1100" y="527" text-anchor="middle" font-size="13" font-weight="700" fill="#3b48cc">Read Replica</text>
  <text x="1100" y="547" text-anchor="middle" font-size="11" fill="#5b6b7c">async &#183; lag in seconds</text>

  <!-- ============ TRAFFIC ARROWS ============ -->
  <!-- WAF -> ALBs -->
  <line x1="180" y1="445" x2="372" y2="262" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="200" y="330" font-size="11" fill="#5b6b7c">3 &#183; HTTPS :443</text>
  <line x1="180" y1="465" x2="892" y2="262" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="420" y="430" font-size="11" fill="#5b6b7c">3 &#183; HTTPS :443</text>

  <!-- ALB -> app -> proxy (AZ-A) -->
  <polyline points="480,290 480,395 585,395 585,432" fill="none" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="330" font-size="11" fill="#5b6b7c">HTTP :80</text>
  <text x="492" y="388" font-size="11" fill="#5b6b7c">pooled</text>
  <!-- proxy -> primary -->
  <line x1="480" y1="430" x2="480" y2="495" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="468" font-size="11" fill="#5b6b7c">:5432</text>

  <!-- ALB -> app -> proxy (AZ-B) -->
  <polyline points="1000,290 1000,395 1105,395 1105,432" fill="none" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1012" y="330" font-size="11" fill="#5b6b7c">HTTP :80</text>
  <line x1="1105" y1="430" x2="1105" y2="495" stroke="#5b6b7c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1117" y="468" font-size="11" fill="#5b6b7c">:5432</text>

  <!-- sync replication primary -> standby -->
  <line x1="595" y1="535" x2="770" y2="535" stroke="#3b48cc" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="640" y="524" font-size="11" font-weight="700" fill="#3b48cc">sync replication</text>
  <!-- async standby -> read replica -->
  <line x1="975" y1="535" x2="990" y2="535" stroke="#5b6b7c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="940" y="592" font-size="11" fill="#5b6b7c">async</text>

  <!-- ============ SUPPORTING SERVICES ============ -->
  <rect x="210" y="695" width="1060" height="170" rx="10" fill="none" stroke="#232f3e" stroke-width="2" stroke-dasharray="10,6"/>
  <text x="226" y="718" font-size="13" font-weight="700" fill="#232f3e">Supporting services</text>

  <rect x="240" y="732" width="230" height="110" rx="8" fill="#ff9900"/>
  <text x="355" y="762" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">Secrets Manager</text>
  <text x="355" y="782" text-anchor="middle" font-size="11" fill="#ffffff">master password</text>
  <text x="355" y="798" text-anchor="middle" font-size="11" fill="#ffffff">auto-rotation &#183; 30 days</text>

  <rect x="495" y="732" width="230" height="110" rx="8" fill="#dd344c"/>
  <text x="610" y="762" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">KMS</text>
  <text x="610" y="782" text-anchor="middle" font-size="11" fill="#ffffff">encryption at rest</text>
  <text x="610" y="798" text-anchor="middle" font-size="11" fill="#ffffff">storage + snapshots</text>

  <rect x="750" y="732" width="230" height="110" rx="8" fill="#569a31"/>
  <text x="865" y="762" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">S3 &#8212; Backups</text>
  <text x="865" y="782" text-anchor="middle" font-size="11" fill="#ffffff">automated snapshots</text>
  <text x="865" y="798" text-anchor="middle" font-size="11" fill="#ffffff">PITR &#183; 7&#8211;35 day retention</text>

  <rect x="1005" y="732" width="230" height="110" rx="8" fill="#ff9900"/>
  <text x="1120" y="762" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">CloudWatch</text>
  <text x="1120" y="782" text-anchor="middle" font-size="11" fill="#ffffff">alarms: connections,</text>
  <text x="1120" y="798" text-anchor="middle" font-size="11" fill="#ffffff">free storage, replica lag</text>

  <!-- service arrows -->
  <line x1="480" y1="610" x2="850" y2="728" stroke="#569a31" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="690" font-size="11" fill="#569a31">daily snapshots + WAL</text>
  <line x1="355" y1="732" x2="355" y2="674" stroke="#5b6b7c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="300" y="706" font-size="11" fill="#5b6b7c">credential rotation</text>
  <line x1="610" y1="732" x2="610" y2="674" stroke="#5b6b7c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="622" y="706" font-size="11" fill="#5b6b7c">SSE-KMS</text>
  <line x1="1120" y1="732" x2="1120" y2="674" stroke="#5b6b7c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
  <text x="1132" y="706" font-size="11" fill="#5b6b7c">metrics</text>
</svg>
